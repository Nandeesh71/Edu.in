# Ex 04 – JavaScript Program Demonstrating Different Data Types

## AIM
To declare and initialize variables using different JavaScript data types: string, number, Boolean, array, and object.

## Procedure
1. Create `datatypes.html` with a `<script>` block.
2. Declare variables using `let` for each data type.
3. Use `document.write()` to display each value in the browser.
4. Open in browser to view output.

### JavaScript Data Types
| Type | Example |
|------|---------|
| String | `"Hello"` |
| Number | `20`, `3.14` |
| Boolean | `true` / `false` |
| Array | `["HTML", "CSS"]` |
| Object | `{ name: "John", age: 20 }` |

## Output
```
String: Ishu
Number: 20
Boolean: true
Array: HTML, CSS, JavaScript
Object – Name: John, Age: 20, Course: Web Development
```



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Data Types</title>
</head>
<body>
  <h2>JavaScript Data Types Example</h2>
  <script>
    // String
    let studentName = "Ishu";

    // Number
    let age = 20;

    // Boolean
    let isStudent = true;

    // Array
    let subjects = ["HTML", "CSS", "JavaScript"];

    // Object
    let student = {
      name: "JOHN",
      age: 20,
      course: "Web Development"
    };

    document.write("String: " + studentName + "<br>");
    document.write("Number: " + age + "<br>");
    document.write("Boolean: " + isStudent + "<br>");
    document.write("Array: " + subjects + "<br>");
    document.write("Object: Name = " + student.name +
      ", Age = " + student.age +
      ", Course = " + student.course);
  </script>
</body>
</html>
