# Ex 05 – JavaScript Function to Find Sum of Even Numbers

## AIM
To write a JavaScript function that accepts an array of numbers, identifies even numbers, and returns their sum.

## Procedure
1. Create `evensum.html` with a `<script>` block.
2. Define a function `sumOfEvenNumbers(numbers)`.
3. Use a `for` loop to iterate through the array.
4. Check each element using the modulus operator `%`.
5. Add even numbers to a running sum and return it.
6. Call the function with a sample array and display the result.

## Output
```
Array: 10,15,20,25,30,35
Sum of Even Numbers: 60
```
(10 + 20 + 30 = 60)



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sum of Even Numbers</title>
</head>
<body>
  <h2>Sum of Even Numbers in an Array</h2>
  <script>
    // Function to calculate sum of even numbers
    function sumOfEvenNumbers(numbers) {
      let sum = 0;
      for (let i = 0; i < numbers.length; i++) {
        if (numbers[i] % 2 === 0) {
          sum += numbers[i];
        }
      }
      return sum;
    }

    // Array of numbers
    let numArray = [10, 15, 20, 25, 30, 35];

    // Function call
    let result = sumOfEvenNumbers(numArray);

    document.write("Array Elements: " + numArray + "<br>");
    document.write("Sum of Even Numbers: " + result);
  </script>
</body>
</html>
